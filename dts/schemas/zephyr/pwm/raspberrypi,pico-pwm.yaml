  divider-frac-3:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: See divider-frac-0 for help
  divider-frac-4:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: See divider-frac-0 for help
  divider-frac-5:
