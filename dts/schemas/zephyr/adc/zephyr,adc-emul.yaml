# Converted from dts/bindings/adc/zephyr,adc-emul.yaml by migrate_binding.py.
%YAML 1.2
---
$id: http://devicetree.org/schemas/zephyr/adc/zephyr,adc-emul.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Zephyr ADC Emulator
maintainers:
- Zephyr Devicetree subsystem <devel@lists.zephyrproject.org>
properties:
  compatible:
    const: zephyr,adc-emul
  '#address-cells':
    const: 1
  '#io-channel-cells':
    $ref: /schemas/types.yaml#/definitions/uint32
  '#size-cells':
    const: 0
  nchannels:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of emulated ADC channels.
    minimum: 1
    maximum: 32
  ref-external0-mv:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: External 0 reference voltage in mV. If not provided or set to zero,
      channel setup with ADC_REF_EXTERNAL0 will fail.
    default: 0
  ref-external1-mv:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: External 1 reference voltage in mV. If not provided or set to zero,
      channel setup with ADC_REF_EXTERNAL1 will fail.
    default: 0
  ref-internal-mv:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Internal reference voltage in mV. If not provided or set to zero,
      channel setup with ADC_REF_INTERNAL will fail.
    default: 0
  ref-vdd-mv:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: VDD reference voltage in mV. If not provided or set to zero, channel
      setup with ADC_REF_VDD_X will fail.
    default: 0
patternProperties:
  ^.*$:
    properties:
      reg: true
      zephyr,acquisition-time:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          Acquisition time.
          Use the ADC_ACQ_TIME macro to compose the value for this property
          or pass ADC_ACQ_TIME_DEFAULT to use the default setting for a given
          hardware (e.g. when the hardware does not allow to configure the
          acquisition time).
      zephyr,current-source-pin:
        $ref: /schemas/types.yaml#/definitions/uint8-array
        description: |-
          Output pin selection for the current sources. The actual
          interpretation depends on the driver. This is used only for drivers
          which select the ADC_CONFIGURABLE_EXCITATION_CURRENT_SOURCE_PIN
          Kconfig option.
      zephyr,differential:
        type: boolean
        description: |-
          When set, selects differential input mode for the channel. Otherwise,
          single-ended mode is used unless the zephyr,input-negative property is
          specified, in which case the differential mode is selected implicitly.
      zephyr,gain:
        $ref: /schemas/types.yaml#/definitions/string
        description: |-
          Gain selection:
          - ADC_GAIN_1_6: x 1/6
          - ADC_GAIN_1_5: x 1/5
          - ADC_GAIN_1_4: x 1/4
          - ADC_GAIN_2_7: x 2/7
          - ADC_GAIN_1_3: x 1/3
          - ADC_GAIN_2_5: x 2/5
          - ADC_GAIN_1_2: x 1/2
          - ADC_GAIN_2_3: x 2/3
          - ADC_GAIN_4_5: x 4/5
          - ADC_GAIN_1:   x 1
          - ADC_GAIN_2:   x 2
          - ADC_GAIN_3:   x 3
          - ADC_GAIN_4:   x 4
          - ADC_GAIN_6:   x 6
          - ADC_GAIN_8:   x 8
          - ADC_GAIN_12:  x 12
          - ADC_GAIN_16:  x 16
          - ADC_GAIN_24:  x 24
          - ADC_GAIN_32:  x 32
          - ADC_GAIN_64:  x 64
          - ADC_GAIN_128: x 128
        enum:
        - ADC_GAIN_1_6
        - ADC_GAIN_1_5
        - ADC_GAIN_1_4
        - ADC_GAIN_2_7
        - ADC_GAIN_1_3
        - ADC_GAIN_2_5
        - ADC_GAIN_1_2
        - ADC_GAIN_2_3
        - ADC_GAIN_4_5
        - ADC_GAIN_1
        - ADC_GAIN_2
        - ADC_GAIN_3
        - ADC_GAIN_4
        - ADC_GAIN_6
        - ADC_GAIN_8
        - ADC_GAIN_12
        - ADC_GAIN_16
        - ADC_GAIN_24
        - ADC_GAIN_32
        - ADC_GAIN_64
        - ADC_GAIN_128
      zephyr,input-negative:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          Negative ADC input. Used only for drivers that select
          the ADC_CONFIGURABLE_INPUTS Kconfig option.
          When specified, implies the differential input mode for the channel.
      zephyr,input-positive:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          Positive ADC input. Used only for drivers that select
          the ADC_CONFIGURABLE_INPUTS Kconfig option.
      zephyr,oversampling:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          Oversampling setting to be used for the channel.
          When specified, each sample is averaged from 2^N conversion results
          (where N is the provided value).
      zephyr,reference:
        $ref: /schemas/types.yaml#/definitions/string
        description: |-
          Reference selection:
          - ADC_REF_VDD_1:     VDD
          - ADC_REF_VDD_1_2:   VDD/2
          - ADC_REF_VDD_1_3:   VDD/3
          - ADC_REF_VDD_1_4:   VDD/4
          - ADC_REF_INTERNAL:  Internal
          - ADC_REF_EXTERNAL0: External, input 0
          - ADC_REF_EXTERNAL1: External, input 1
        enum:
        - ADC_REF_VDD_1
        - ADC_REF_VDD_1_2
        - ADC_REF_VDD_1_3
        - ADC_REF_VDD_1_4
        - ADC_REF_INTERNAL
        - ADC_REF_EXTERNAL0
        - ADC_REF_EXTERNAL1
      zephyr,resolution:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: ADC resolution to be used for the channel.
      zephyr,vbias-pins:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          Output pin selection for the bias voltage. The actual interpretation
          depends on the driver. This is used only for drivers which select
          the ADC_CONFIGURABLE_VBIAS_PIN Kconfig option.
      zephyr,vref-mv:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |-
          This property can be used to specify the voltage (in millivolts)
          of the reference selected for this channel, so that applications
          can get that value if needed for some calculations.
          For the internal reference, the voltage can be usually obtained with
          a dedicated ADC API call, so there is no need to use this property
          in that case, but for other references this property can be useful.
    required:
    - reg
    - zephyr,acquisition-time
    - zephyr,gain
    - zephyr,reference
    description: |-
      Channel configuration.

      All nodes using this binding must be named "channel", otherwise their
      data will not be accessible for the ADC API macros.

      This is based on Linux, documentation:
        https://www.kernel.org/doc/Documentation/devicetree/bindings/iio/adc/adc.yaml
required:
- compatible
- '#io-channel-cells'
- nchannels
additionalProperties: true
