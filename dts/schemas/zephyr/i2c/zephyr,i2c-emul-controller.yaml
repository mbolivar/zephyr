%YAML 1.2
---
$id: http://devicetree.org/schemas/zephyr/i2c/zephyr,i2c-emul-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Zephyr I2C Emulation controller
maintainers:
- Zephyr Devicetree subsystem <devel@lists.zephyrproject.org>
properties:
  compatible:
    const: zephyr,i2c-emul-controller
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0
  cq-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Size of the completion queue for blocking requests
    default: 4
  forwards:
    $ref: /schemas/types.yaml#/definitions/phandle-array
