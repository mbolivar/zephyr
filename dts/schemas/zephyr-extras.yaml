# SPDX-License-Identifier: Apache-2.0
# Zephyr supplement to dt-schema documents: specifier
# cell names and bus typing, which dt-schema cannot
# express (yet). See dtschema_bindings.py.
compatibles:
  arm,pl011:
    bus: uart
  arm,pl022:
    bus: spi
  arm,v6m-nvic:
    interrupt-cells:
    - irq
    - priority
  arm,v7m-nvic:
    interrupt-cells:
    - irq
    - priority
  nordic,nrf-ficr:
    nordic,ficr-cells:
    - offset
  nordic,nrf-gpio:
    gpio-cells:
    - pin
    - flags
  nordic,nrf-i2s:
    bus: i2s
  nordic,nrf-pwm:
    pwm-cells:
    - channel
    - period
    - flags
  nordic,nrf-qspi:
    bus: qspi
  nordic,nrf-saadc:
    io-channel-cells:
    - input
  nordic,nrf-spi:
    bus: spi
  nordic,nrf-spim:
    bus: spi
  nordic,nrf-sw-pwm:
    pwm-cells:
    - channel
    - period
    - flags
  nordic,nrf-twi:
    bus: i2c
  nordic,nrf-uarte:
    bus: uart
  nordic,nrf-usbd:
    bus: usb
  nordic,qspi-nor:
    on-bus: qspi
  raspberrypi,pico-adc:
    io-channel-cells:
    - input
  raspberrypi,pico-clock-controller:
    clock-cells:
    - clk-id
  raspberrypi,pico-dma:
    dma-cells:
    - channel
    - slot
    - channel-config
    bus: dma
  raspberrypi,pico-gpio-port:
    gpio-cells:
    - pin
    - flags
  raspberrypi,pico-i2c:
    bus: i2c
  raspberrypi,pico-pwm:
    pwm-cells:
    - channel
    - period
    - flags
  raspberrypi,pico-reset:
    reset-cells:
    - id
  raspberrypi,pico-spi:
    bus: spi
  raspberrypi,pico-uart:
    bus: uart
  raspberrypi,pico-usbd:
    bus: usb
  snps,designware-i2c:
    bus: i2c
  ti,stellaris-gpio:
    gpio-cells:
    - pin
    - flags
  ti,stellaris-uart:
    bus: uart
  zephyr,adc-emul:
    io-channel-cells:
    - input
  zephyr,dma-emul:
    bus: dma
  zephyr,espi-emul-controller:
    bus: espi
  zephyr,gpio-emul:
    gpio-cells:
    - pin
    - flags
  zephyr,i2c-emul-controller:
    forward-cells:
    - addr
    bus: i2c
  zephyr,mspi-emul-controller:
    bus: mspi
  zephyr,native-posix-udc:
    bus: usb
  zephyr,native-pty-uart:
    bus: uart
  zephyr,spi-emul-controller:
    bus: spi
