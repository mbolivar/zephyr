# SPDX-License-Identifier: BSD-3-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/test/vnd,dtschema-thermometer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test thermometer with value constraints (for dt-validate)

maintainers:
  - python-devicetree tests

properties:
  compatible:
    const: vnd,dtschema-thermometer

  reg:
    maxItems: 1

  resolution:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [8, 12, 16]

  poll-rate:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 10
    maximum: 1000

required:
  - compatible
  - reg

# Value-level validation the classic language cannot express: bad
# resolution enums, out-of-range poll rates, and unknown properties are
# all rejected.
unevaluatedProperties: false
