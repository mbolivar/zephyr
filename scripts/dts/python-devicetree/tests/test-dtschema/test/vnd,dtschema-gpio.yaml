# SPDX-License-Identifier: BSD-3-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/test/vnd,dtschema-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test GPIO controller (cell names from the gpio specifier-space default)

maintainers:
  - python-devicetree tests

properties:
  compatible:
    const: vnd,dtschema-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

  ngpios:
    default: 32

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: true
