# SPDX-License-Identifier: BSD-3-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/test/vnd,dtschema-device.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test device exercising every translatable property type

maintainers:
  - python-devicetree tests

properties:
  compatible:
    const: vnd,dtschema-device

  reg:
    maxItems: 1

  an-int:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 11
    minimum: 1
    maximum: 100

  enum-int:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [10, 20, 30]

  const-int:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 42

  an-array:
    $ref: /schemas/types.yaml#/definitions/uint32-array

  bytes:
    $ref: /schemas/types.yaml#/definitions/uint8-array

  a-string:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [alpha, beta]

  strings:
    $ref: /schemas/types.yaml#/definitions/string-array

  a-phandle:
    $ref: /schemas/types.yaml#/definitions/phandle

  some-phandles:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1

  det-gpios:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1

  a-bool:
    type: boolean

  delay-us:
    maximum: 1000

  deprecated-int:
    $ref: /schemas/types.yaml#/definitions/uint32
    deprecated: true

required:
  - compatible
  - reg
  - an-int

additionalProperties: true
