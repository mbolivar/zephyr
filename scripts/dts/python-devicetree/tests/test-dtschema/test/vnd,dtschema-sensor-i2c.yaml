%YAML 1.2
---
$id: http://devicetree.org/schemas/test/vnd,dtschema-sensor-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test sensor on I2C (multi-bus pattern, i2c variant)

maintainers:
  - python-devicetree tests

allOf:
  - $ref: vnd,dtschema-sensor-common.yaml#

properties:
  compatible:
    const: vnd,dtschema-sensor

  reg:
    maxItems: 1

  i2c-extra:
    type: boolean
    description: property that only exists on the I2C variant

required:
  - compatible

additionalProperties: true
