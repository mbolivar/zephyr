# SPDX-License-Identifier: BSD-3-Clause
# Zephyr supplement for the dt-schema test bindings: specifier cell
# names and bus typing, which dt-schema cannot express.
specifier-spaces:
  gpio:
    cells: [pin, flags]
compatibles:
  vnd,dtschema-intc:
    interrupt-cells: [irq, prio]
  vnd,dtschema-serial-ctrl:
    bus: vndserial
  vnd,dtschema-serial-dev:
    on-bus: vndserial
  vnd,dtschema-i2c-ctrl:
    bus: i2c
  vnd,dtschema-spi-ctrl:
    bus: spi
  # Multi-bus pattern: one compatible (vnd,dtschema-sensor), two
  # documents, told apart by the '<compatible>-<bus>' supplement key.
  vnd,dtschema-sensor-i2c:
    on-bus: i2c
  vnd,dtschema-sensor-spi:
    on-bus: spi
