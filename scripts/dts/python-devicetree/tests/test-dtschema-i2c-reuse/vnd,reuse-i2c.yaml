%YAML 1.2
---
$id: http://devicetree.org/schemas/test/vnd,reuse-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test I2C controller reusing the standard dt-schema i2c-controller schema

maintainers:
  - python-devicetree tests

# Payoff B in miniature: this Zephyr-style dt-schema document reuses an
# ecosystem-standard schema by $ref (resolved from the dtschema package;
# nothing is copied in) and thereby inherits real value validation -- every
# child's reg must be a valid I2C address and clock-frequency must be sane --
# which the classic bindings language cannot express.
allOf:
  - $ref: http://devicetree.org/schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: vnd,reuse-i2c

required:
  - compatible

additionalProperties: true
